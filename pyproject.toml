[project]
name = "github-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zfoudaz", email = "ziyadandali@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.5",
    "gitingest>=0.3.1",
    "grandalf>=0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.1",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
github-ai-agent = "github_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
